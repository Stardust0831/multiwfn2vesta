name: Build rc1 executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-rc1-executables.yml"
      - "scripts/pyinstaller_entry.py"
      - "pyproject.toml"
      - "docs/releases/v0.1.0-rc.1.md"
      - "docs/executable_distribution_zh.md"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  pyinstaller:
    name: PyInstaller ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: multiwfn2vesta-linux-x86_64
            built_file: dist/multiwfn2vesta
          - os: windows-latest
            asset_name: multiwfn2vesta-windows-x86_64.exe
            built_file: dist/multiwfn2vesta.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .

      - name: Build executable
        run: |
          pyinstaller --onefile --name multiwfn2vesta scripts/pyinstaller_entry.py

      - name: Smoke test
        run: |
          "${{ matrix.built_file }}" tools --lang en

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          cp "${{ matrix.built_file }}" "release-assets/${{ matrix.asset_name }}"
          gh release upload v0.1.0-rc.1 "release-assets/${{ matrix.asset_name }}" --clobber

  portable-python:
    name: Portable Python zipapp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zipapp package
        run: |
          mkdir -p build/zipapp/multiwfn2vesta build/portable
          cp -R src/multiwfn2vesta build/zipapp/
          cat > build/zipapp/__main__.py <<'PY'
          from multiwfn2vesta.cli import main
          raise SystemExit(main())
          PY
          python -m zipapp build/zipapp -p "/usr/bin/env python3" -o build/portable/multiwfn2vesta.pyz
          chmod +x build/portable/multiwfn2vesta.pyz
          cat > build/portable/multiwfn2vesta <<'SH'
          #!/usr/bin/env sh
          exec python3 "$(dirname "$0")/multiwfn2vesta.pyz" "$@"
          SH
          chmod +x build/portable/multiwfn2vesta
          cat > build/portable/multiwfn2vesta.cmd <<'BAT'
          @echo off
          py "%~dp0multiwfn2vesta.pyz" %*
          BAT
          cp docs/executable_distribution_zh.md build/portable/README_zh.md
          (cd build/portable && zip -r ../../multiwfn2vesta-portable-python.zip .)

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0-rc.1 build/multiwfn2vesta-portable-python.zip --clobber

  update-notes:
    name: Update release notes
    runs-on: ubuntu-latest
    needs:
      - pyinstaller
      - portable-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0-rc.1 --notes-file docs/releases/v0.1.0-rc.1.md
