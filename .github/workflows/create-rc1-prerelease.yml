name: Create rc1 prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-rc1-prerelease.yml"
      - "docs/releases/v0.1.0-rc.1.md"

permissions:
  contents: write

jobs:
  create-prerelease:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: v0.1.0-rc.1
      RELEASE_NOTES: docs/releases/v0.1.0-rc.1.md
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag exists
        run: |
          git fetch --tags origin
          git rev-parse --verify "refs/tags/${TAG_NAME}"

      - name: Create prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists; nothing to do."
            exit 0
          fi
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes-file "${RELEASE_NOTES}" \
            --prerelease \
            --verify-tag
